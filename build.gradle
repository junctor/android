plugins {
    alias libs.plugins.android.application apply false
    alias libs.plugins.android.library apply false
    alias libs.plugins.compose.compiler apply false
    alias libs.plugins.google.services apply false
    alias libs.plugins.firebase.crashlytics apply false
    alias libs.plugins.ktlint
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}

tasks.register('ciCheck') {
    group = 'verification'
    description = 'Runs the same checks as GitHub CI (ktlint, unit tests, app lintDebug, assembleDebug).'
    dependsOn ':app:lintDebug', ':app:assembleDebug'
}

gradle.projectsEvaluated {
    tasks.named('ciCheck').configure {
        dependsOn(
            allprojects
                .findAll { it.tasks.findByName('ktlintCheck') != null }
                .collect { it.tasks.named('ktlintCheck') },
        )
        dependsOn(
            allprojects
                .findAll { it.tasks.findByName('test') != null }
                .collect { it.tasks.named('test') },
        )
    }
}
