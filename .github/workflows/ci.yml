name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Persist dependency caches across runs so cold CI hits Maven less often.
          # Only main writes the cache; PRs reuse it read-only.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            cp app/google-services.json.example app/google-services.json
          fi

      - name: Write report URL
        env:
          REPORT_URL: ${{ secrets.REPORT_URL }}
        run: |
          if [ -n "$REPORT_URL" ]; then
            echo "REPORT_URL=$REPORT_URL" >> local.properties
          fi

      # Keep the daemon across steps (setup-gradle stops it at job end) so later
      # steps reuse the already-resolved classpath instead of re-hitting Maven.
      - name: ktlint
        run: ./gradlew ktlintCheck

      - name: Unit tests
        run: ./gradlew test

      - name: Lint (app)
        run: ./gradlew :app:lintDebug

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug
