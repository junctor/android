pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        // Prefer Google's Maven Central mirror to avoid CI 429s from shared runner IPs.
        maven {
            name = "GoogleMavenCentral"
            url = "https://maven-central.storage-download.googleapis.com/maven2/"
        }
        mavenCentral()
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        // Prefer Google's Maven Central mirror to avoid CI 429s from shared runner IPs.
        maven {
            name = "GoogleMavenCentral"
            url = "https://maven-central.storage-download.googleapis.com/maven2/"
        }
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
}
rootProject.name = "Schedule"
include ':app'
include ':ui'
include ':core'
include ':data'
include ':infra-firebase'
include ':feature-merch'
include ':feature-locations'
include ':infra-reminder'
include ':infra-retrofit'
include ':feature-wifi'
include ':feature-organizations'
include ':feature-documents'
include ':infra-analytics'
include ':infra-play'
include ':feature-feedback'
include ':feature-maps'
include ':feature-news'
include ':feature-faq'
include ':feature-speakers'
include ':feature-settings'
include ':feature-search'
include ':feature-menu'
